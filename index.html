<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShiryouKaidoku サービス状況</title>
<meta name="description" content="ShiryouKaidoku の稼働状況・障害履歴・メンテナンス予定を掲載するステータスページです。">
<style>
    :root {
        --ink: #1f2937;
        --ink-sub: #6b7280;
        --line: #e5e7eb;
        --ok: #15803d;
        --ok-bg: #ecfdf5;
        --warn: #b45309;
        --warn-bg: #fffbeb;
        --bad: #b91c1c;
        --bad-bg: #fef2f2;
        --maint: #1d4ed8;
        --maint-bg: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        /* アプリ本体と同じ既定フォント（base.css の font-family-default） */
        font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'YuGothic', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif;
        color: var(--ink);
        background: #f8f9fa;
        line-height: 1.7;
    }
    .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 16px 80px;
    }
    header.page-head h1 {
        font-size: 22px;
        margin: 0 0 4px;
    }
    header.page-head p {
        margin: 0 0 24px;
        color: var(--ink-sub);
        font-size: 14px;
    }
    .banner {
        border: 1px solid var(--line);
        /* 左の色ボーダーは角を丸めない（右側だけカードと同じ角丸） */
        border-radius: 0 12px 12px 0;
        padding: 20px 22px;
        margin-bottom: 28px;
        background: #fff;
    }
    .banner--ok { border-left: 6px solid var(--ok); background: var(--ok-bg); }
    .banner--warn { border-left: 6px solid var(--warn); background: var(--warn-bg); }
    .banner--bad { border-left: 6px solid var(--bad); background: var(--bad-bg); }
    .banner--maint { border-left: 6px solid var(--maint); background: var(--maint-bg); }
    .banner .state {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 4px;
    }
    .banner .updated {
        font-size: 13px;
        color: var(--ink-sub);
        margin: 0;
    }
    .banner .note {
        margin: 8px 0 0;
        font-size: 14px;
    }
    section.card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px 22px;
        margin-bottom: 24px;
    }
    section.card h2 {
        font-size: 16px;
        margin: 0 0 14px;
    }
    ul.comp-list, ul.event-list {
        list-style: none;
        margin: 0;
        padding: 0;
    }
    ul.comp-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
    }
    ul.comp-list li:last-child { border-bottom: none; }
    .pill {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        padding: 2px 12px;
        white-space: nowrap;
    }
    .pill--ok { color: var(--ok); background: var(--ok-bg); border: 1px solid var(--ok); }
    .pill--warn { color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn); }
    .pill--bad { color: var(--bad); background: var(--bad-bg); border: 1px solid var(--bad); }
    .pill--maint { color: var(--maint); background: var(--maint-bg); border: 1px solid var(--maint); }
    ul.event-list li {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
    }
    ul.event-list li:last-child { border-bottom: none; }
    .event-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .event-title { font-weight: 700; }
    .event-meta {
        color: var(--ink-sub);
        font-size: 13px;
        margin-top: 2px;
    }
    .event-desc { margin: 6px 0 0; font-size: 14px; }
    .empty {
        color: var(--ink-sub);
        font-size: 14px;
        margin: 0;
    }
    .loading {
        color: var(--ink-sub);
        font-size: 14px;
    }
    footer.page-foot {
        margin-top: 40px;
        font-size: 13px;
        color: var(--ink-sub);
        border-top: 1px solid var(--line);
        padding-top: 16px;
    }
    footer.page-foot a { color: var(--maint); }
    noscript .ns { color: var(--bad); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
    <header class="page-head">
        <h1>ShiryouKaidoku サービス状況</h1>
        <p>稼働状況・障害履歴・メンテナンス予定を掲載しています。アプリ本体が使えないときでも、このページは閲覧できます。</p>
    </header>

    <div id="overall-banner" class="banner">
        <p class="state loading">読み込み中…</p>
    </div>

    <section class="card">
        <h2>サービスごとの状況</h2>
        <ul id="components" class="comp-list">
            <li class="loading">読み込み中…</li>
        </ul>
    </section>

    <section class="card">
        <h2>予定されているメンテナンス</h2>
        <ul id="maintenance" class="event-list">
            <li class="loading">読み込み中…</li>
        </ul>
    </section>

    <section class="card">
        <h2>障害履歴（直近）</h2>
        <ul id="incidents" class="event-list">
            <li class="loading">読み込み中…</li>
        </ul>
    </section>

    <footer class="page-foot">
        <p>このページは ShiryouKaidoku の稼働状況を知らせるものです。情報は手動で更新しています。</p>
    </footer>
</div>
<noscript><div class="wrap"><p class="ns">このページの表示には JavaScript が必要です。</p></div></noscript>

<script>
"use strict";

/* 状態コード → 表示（追加したい状態が出たらここに足す） */
const STATUS_LABELS = {
    operational: { text: "正常", pill: "pill--ok", banner: "banner--ok", bannerText: "すべてのサービスは正常に動いています" },
    degraded:    { text: "一部低下", pill: "pill--warn", banner: "banner--warn", bannerText: "一部の機能が遅い・使いにくい状態です" },
    outage:      { text: "障害発生中", pill: "pill--bad", banner: "banner--bad", bannerText: "障害が発生しています。復旧に向けて対応中です" },
    maintenance: { text: "メンテナンス中", pill: "pill--maint", banner: "banner--maint", bannerText: "メンテナンス作業中です" },
};

const COMPONENT_LABELS = {
    operational: "正常",
    degraded: "遅延・一部不調",
    outage: "停止中",
    maintenance: "メンテナンス中",
};

const fmt = (iso) => {
    if (!iso) return "—";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleString("ja-JP", {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit",
    });
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

const fetchJson = async (name) => {
    /* キャッシュ回避＝状況は常に最新を見せたい */
    const res = await fetch(name + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(name + " の読み込みに失敗");
    return res.json();
};

const renderOverall = (status) => {
    const el = document.getElementById("overall-banner");
    const info = STATUS_LABELS[status.overall] || STATUS_LABELS.operational;
    el.className = "banner " + info.banner;
    el.innerHTML =
        '<p class="state">' + esc(info.bannerText) + "</p>" +
        '<p class="updated">最終更新: ' + esc(fmt(status.updated_at)) + "</p>" +
        (status.note ? '<p class="note">' + esc(status.note) + "</p>" : "");
};

const renderComponents = (list) => {
    const el = document.getElementById("components");
    if (!Array.isArray(list) || list.length === 0) {
        el.innerHTML = '<li><span class="empty">掲載する項目はありません。</span></li>';
        return;
    }
    el.innerHTML = list.map((c) => {
        const info = STATUS_LABELS[c.status] || STATUS_LABELS.operational;
        const label = COMPONENT_LABELS[c.status] || info.text;
        return '<li><span>' + esc(c.name) + '</span>' +
            '<span class="pill ' + info.pill + '">' + esc(label) + "</span></li>";
    }).join("");
};

const renderMaintenance = (list) => {
    const el = document.getElementById("maintenance");
    if (!Array.isArray(list) || list.length === 0) {
        el.innerHTML = '<li><span class="empty">予定されているメンテナンスはありません。</span></li>';
        return;
    }
    el.innerHTML = list.map((m) =>
        '<li><div class="event-head">' +
        '<span class="pill pill--maint">予定</span>' +
        '<span class="event-title">' + esc(m.title) + "</span></div>" +
        '<div class="event-meta">' + esc(fmt(m.starts_at)) + " 〜 " + esc(fmt(m.ends_at)) + "</div>" +
        (m.description ? '<p class="event-desc">' + esc(m.description) + "</p>" : "") +
        "</li>"
    ).join("");
};

const renderIncidents = (list) => {
    const el = document.getElementById("incidents");
    if (!Array.isArray(list) || list.length === 0) {
        el.innerHTML = '<li><span class="empty">記録された障害はありません。</span></li>';
        return;
    }
    el.innerHTML = list.map((inc) => {
        const resolved = inc.is_resolved !== false;
        const badge = resolved
            ? '<span class="pill pill--ok">解消済み</span>'
            : '<span class="pill pill--bad">対応中</span>';
        const meta = "開始: " + esc(fmt(inc.started_at)) +
            (inc.ended_at ? "　終了: " + esc(fmt(inc.ended_at)) : "") +
            (inc.downtime_minutes != null ? "　止まっていた時間: 約" + esc(inc.downtime_minutes) + "分" : "");
        return '<li><div class="event-head">' + badge +
            '<span class="event-title">' + esc(inc.title) + "</span></div>" +
            '<div class="event-meta">' + meta + "</div>" +
            (inc.description ? '<p class="event-desc">' + esc(inc.description) + "</p>" : "") +
            "</li>";
    }).join("");
};

const fail = (id) => {
    document.getElementById(id).innerHTML =
        '<li><span class="empty">読み込めませんでした。時間をおいて開き直してください。</span></li>';
};

(async () => {
    try {
        const status = await fetchJson("status.json");
        renderOverall(status);
        renderComponents(status.components);
    } catch (e) {
        document.getElementById("overall-banner").innerHTML =
            '<p class="state">状況を読み込めませんでした。</p>';
        fail("components");
    }
    try {
        const maint = await fetchJson("maintenance.json");
        renderMaintenance(maint.scheduled);
    } catch (e) {
        fail("maintenance");
    }
    try {
        const inc = await fetchJson("incidents.json");
        renderIncidents(inc.incidents);
    } catch (e) {
        fail("incidents");
    }
})();
</script>
</body>
</html>
